# ROADMAP.md 로컬 개발 환경: 서비스는 api/ui 두 개뿐이다.
# SQLite는 별도 서비스가 아니라 api 컨테이너에 임베디드된 파일 DB이며,
# 여러 프로젝트의 소스 저장소는 상위 workspace 디렉터리 하나를 api 컨테이너에 read-only로 마운트한다
# (ADR-0004). 프로젝트 등록은 Web UI 또는 POST /projects로 workspace-root 기준 상대 경로를 준다.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      # 호스트 포트가 이미 사용 중이면 `API_PORT=9081 docker compose up --build`처럼 덮어쓴다.
      - '${API_PORT:-9080}:8080'
    environment:
      CONTEXTSOURCE_DB: /app/data/contextsource.sqlite
      CONTEXTSOURCE_WORKSPACE_ROOT: /workspaces
      PORT: 8080
      # 비워두면(기본값) 기존과 동일하게 인증 없이 동작한다. 포트를 호스트 밖으로 노출하는
      # 배포라면 `CONTEXTSOURCE_API_KEY=<secret> docker compose up`으로 값을 지정한다 —
      # 이후 조회(GET)는 그대로 열려 있고 변경 오퍼레이션(POST/PATCH/DELETE)에는
      # `x-api-key: <secret>` 헤더가 필요하다(ADR-0010, BENCHMARK.md 5.12).
      # 주의: Web UI(ui 서비스)는 이 키를 모른다 — 켜면 Web UI의 등록/삭제/기술 스택 편집/
      # 분석 실행 같은 쓰기 동작도 401로 막힌다(의도된 동작, ADR-0010 "하지 않는 것" 참고).
      CONTEXTSOURCE_API_KEY: ${CONTEXTSOURCE_API_KEY:-}
    volumes:
      - contextsource-data:/app/data
      # 여러 프로젝트를 담는 상위 디렉터리 — 기본값은 저장소에 포함된 샘플 프로젝트들의 부모 디렉터리.
      # 실제 사용 시 `WORKSPACE_ROOT=/path/to/your/projects docker compose up --build`로 덮어쓴다.
      - ${WORKSPACE_ROOT:-./samples}:/workspaces:ro
    healthcheck:
      # node:22-slim에는 curl/wget이 없으므로 node 자체로 HTTP 요청을 보낸다.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 요청/에러 로그는 stdout/stderr에 한 줄짜리 JSON으로 나온다 — `docker compose logs -f api`로 바로
    # 보거나 원하는 로그 드라이버/수집기를 붙인다. GET /metrics(버전 접두어 없음)는 Prometheus 텍스트
    # 노출 형식을 제공한다 — 이 compose 파일 자체는 Prometheus를 띄우지 않는다(ADR-0015, BENCHMARK.md 5.16).

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - '${UI_PORT:-9090}:3000'
    environment:
      CONTEXTSOURCE_API_URL: http://api:8080
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  contextsource-data:
